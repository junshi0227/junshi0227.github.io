<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Junshi Blog · 写作台</title>
  <link rel="stylesheet" href="/vendor/toastui-editor.css">
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <div class="shell">
    <aside class="sidebar">
      <div class="brand"><span class="brand-mark">J.</span><div><strong>Junshi Blog</strong><small>写作台</small></div></div>
      <button id="new-post" class="new-button" type="button">＋ 写新文章</button>
      <div class="side-title"><span>文章</span><span id="post-count">0</span></div>
      <div id="article-list" class="article-list"></div>
      <div class="sidebar-bottom"><a href="https://junshi0227.github.io/" target="_blank" rel="noopener">打开线上博客 ↗</a><span>仅在这台电脑上运行</span></div>
    </aside>
    <main class="workspace">
      <header class="topbar"><div><span class="eyebrow">WRITE / PUBLISH</span><h1>好好写一篇文章。</h1></div><div class="top-actions"><span id="save-state" class="state">准备就绪</span><button id="preview" class="button subtle" type="button">预览</button><button id="save" class="button subtle" type="button">保存</button><button id="publish" class="button primary" type="button">发布上线 ↗</button></div></header>
      <div class="content">
        <section class="form-panel">
          <div class="section-label"><span>01</span> 文章信息</div>
          <label class="field full"><span>标题</span><input id="title" type="text" placeholder="这篇文章想讲什么？" maxlength="150"></label>
          <div class="form-grid"><label class="field"><span>文章链接（英文）</span><input id="slug" type="text" placeholder="my-new-post" pattern="[a-zA-Z0-9-]+"></label><label class="field"><span>文章日期</span><input id="date" type="datetime-local"></label></div>
          <label class="field full"><span>摘要 <em>显示在文章列表</em></span><textarea id="description" rows="2" placeholder="用一两句话介绍文章内容"></textarea></label>
          <div class="form-grid"><label class="field"><span>分类 <em>多个用逗号分隔</em></span><input id="categories" type="text" placeholder="项目记录"></label><label class="field"><span>标签 <em>多个用逗号分隔</em></span><input id="tags" type="text" placeholder="GNSS, 数据分析"></label></div>
          <div class="cover-row"><div><strong>封面图片</strong><p>上传后会显示在首页文章卡片。</p></div><div class="cover-tools"><img id="cover-image" hidden alt="封面预览"><input id="thumbnail" type="text" placeholder="/images/..."><label class="upload-button">上传封面<input id="cover-upload" type="file" accept="image/png,image/jpeg,image/webp,image/gif" hidden></label></div></div>
        </section>
        <section class="editor-panel"><div class="editor-heading"><div class="section-label"><span>02</span> 正文排版</div><p>像文档一样写作。工具栏支持标题、加粗、列表、表格、链接和插图。</p></div><div id="editor"></div></section>
        <div class="bottom-actions"><p>保存为草稿不会出现在网站。点击“发布上线”后，GitHub Pages通常还需要短暂构建。</p><button id="save-draft" class="button subtle" type="button">保存为草稿</button></div>
      </div>
    </main>
  </div>
  <div id="toast" role="status" aria-live="polite"></div>
  <dialog id="confirm-dialog"><form method="dialog"><h2>继续编辑这篇文章？</h2><p>切换文章前，请先保存当前修改。</p><div class="dialog-actions"><button value="cancel" class="button subtle">返回</button><button value="discard" class="button primary">放弃未保存修改</button></div></form></dialog>
  <script src="/vendor/toastui-editor.js"></script>
  <script src="/vendor/i18n/zh-cn.js"></script>
  <script src="/app.js"></script>
</body>
</html>
