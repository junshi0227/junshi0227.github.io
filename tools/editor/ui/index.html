<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Junshi Blog · 写作台</title>
  <link rel="stylesheet" href="/vendor/toastui-editor.css">
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <div class="shell">
    <aside class="sidebar">
      <div class="brand"><span class="brand-mark">J.</span><div><strong>Junshi Blog</strong><small>写作台</small></div></div>
      <button id="new-post" class="new-button" type="button">＋ 写新文章</button>
      <div class="side-title"><span>我的文章</span><span id="post-count">0</span></div>
      <div id="article-list" class="article-list"></div>
      <div class="sidebar-bottom"><a href="https://junshi0227.github.io/" target="_blank" rel="noopener">打开线上博客 ↗</a><span>内容保存在这台电脑</span></div>
    </aside>
    <main class="workspace">
      <header class="topbar">
        <div class="topbar-heading"><span class="eyebrow">JUNSHI BLOG / EDITOR</span><h1>文章写作</h1></div>
        <div class="top-actions"><span id="save-state" class="state">准备就绪</span><button id="preview" class="button subtle" type="button">预览文章</button><button id="save" class="button subtle" type="button">保存</button><button id="publish" class="button primary" type="button">发布上线 ↗</button></div>
      </header>
      <div class="content">
        <div id="notice" class="notice" role="status" aria-live="polite" hidden></div>
        <div id="publish-result" class="notice success" hidden>文章已推送到GitHub，部署完成后可以在<a href="https://junshi0227.github.io/" target="_blank" rel="noopener">线上博客</a>查看。<a href="https://github.com/junshi0227/junshi0227.github.io/actions" target="_blank" rel="noopener">查看部署进度</a></div>
        <div class="writing-hint"><span class="writing-dot"></span><span>直接在下方页面写标题和正文，排版工具就在正文上方。</span><button id="settings-shortcut" type="button">文章设置 ↓</button></div>
        <article class="paper">
          <div class="paper-top"><span>新的一页</span><span id="paper-date"></span></div>
          <label for="title" class="visually-hidden">文章标题</label><input id="title" class="paper-title" type="text" placeholder="写下文章标题" maxlength="150">
          <div class="paper-rule"></div>
          <div id="editor"></div>
        </article>
        <details id="post-settings" class="settings">
          <summary><span>文章设置</span><small>摘要、分类、标签、封面与发布日期</small></summary>
          <div class="settings-content">
            <label class="field full"><span>文章摘要 <em>显示在文章列表</em></span><textarea id="description" rows="2" placeholder="用一两句话介绍文章内容"></textarea></label>
            <div class="form-grid"><label class="field"><span>分类 <em>多个用逗号分隔</em></span><input id="categories" type="text" placeholder="项目记录"></label><label class="field"><span>标签 <em>多个用逗号分隔</em></span><input id="tags" type="text" placeholder="GNSS, 数据分析"></label></div>
            <div class="form-grid"><label class="field"><span>文章链接（英文）</span><input id="slug" type="text" placeholder="my-new-post" pattern="[a-zA-Z0-9-]+"></label><label class="field"><span>文章日期</span><input id="date" type="datetime-local"></label></div>
            <div class="cover-row"><div><strong>封面图片</strong><p>显示在首页文章卡片。</p></div><div class="cover-tools"><img id="cover-image" hidden alt="封面预览"><input id="thumbnail" type="text" placeholder="/images/..."><label class="upload-button">上传封面<input id="cover-upload" type="file" accept="image/png,image/jpeg,image/webp,image/gif" hidden></label></div></div>
          </div>
        </details>
        <div class="bottom-actions"><p>保存为草稿不会出现在网站。完成后点“发布上线”推送更新。</p><button id="save-draft" class="button subtle" type="button">保存为草稿</button></div>
      </div>
    </main>
  </div>
  <div id="toast" role="status" aria-live="polite"></div>
  <dialog id="preview-dialog" class="preview-dialog"><div class="preview-top"><div><strong>文章预览</strong><small>当前编辑内容，本机预览</small></div><button id="close-preview" type="button" class="button subtle">关闭</button></div><iframe id="preview-frame" title="文章预览" sandbox=""></iframe></dialog>
  <dialog id="confirm-dialog"><form method="dialog"><h2>继续编辑这篇文章？</h2><p>切换文章前，请先保存当前修改。</p><div class="dialog-actions"><button value="cancel" class="button subtle">返回</button><button value="discard" class="button primary">放弃未保存修改</button></div></form></dialog>
  <script src="/vendor/toastui-editor.js"></script>
  <script src="/vendor/i18n/zh-cn.js"></script>
  <script src="/app.js"></script>
</body>
</html>
