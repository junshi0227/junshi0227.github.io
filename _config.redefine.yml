info:
  title: Junshi Blog
  subtitle: 科研、项目与学习笔记
  author: 君军均俊钧
  url: https://junshi0227.github.io
defaults:
  favicon: /images/favicon.svg
  logo:
  avatar: /images/avatar.jpg
colors:
  primary: '#bd6a68'
  default_mode: light
global:
  content_max_width: 1080px
  scroll_progress:
    bar: false
    percentage: false
  hover:
    shadow: true
    scale: false
  website_counter:
    enable: false
  single_page: false
  open_graph:
    enable: true
    image:
    description: 记录研究过程、工程实践与持续学习。
home_banner:
  enable: true
  style: fixed
  image:
    light: /images/blue-hour-fuji.jpg
    dark: /images/blue-hour-fuji.jpg
  title: Jun·Keep Learning
  subtitle:
    text:
      - 记录科研、项目与学习
      - 分享实践，也保留思考
    typing_speed: 95
    backing_speed: 55
    starting_delay: 450
    backing_delay: 1800
    loop: true
  text_color:
    light: '#ffffff'
    dark: '#ffffff'
  social_links:
    enable: true
    style: default
    links:
      - icon: github
        url: https://github.com/junshi0227
      - icon: fa-solid fa-link
        url: /about/
      - icon: fa-regular fa-folder-open
        url: /projects/
navbar:
  color:
    left: '#f7f8f7'
    right: '#f7f8f7'
    transparency: 98
  width:
    home: 1080px
    pages: 1080px
  links:
    归档:
      path: /archives/
      icon: fa-regular fa-calendar
    分类:
      path: /categories/
      icon: fa-regular fa-folder
    标签:
      path: /tags/
      icon: fa-regular fa-tags
    项目:
      path: /projects/
      icon: fa-regular fa-grid-2
    关于:
      path: /about/
      icon: fa-regular fa-user
  search:
    enable: true
    preload: false
home:
  sidebar:
    enable: true
    position: left
    first_item: menu
    announcement:
    links:
      代表项目:
        path: /projects/
        icon: fa-regular fa-grid-2
      联系方式:
        path: /about/#contact
        icon: fa-regular fa-envelope
  article_date_format: YYYY-MM-DD
  excerpt_length: 160
articles:
  style:
    font_size: 17px
    line_height: 1.8
    image_border_radius: 10px
  author_label:
    enable: true
    auto: false
    list:
      - Do not go gentle into that good night.
  word_count:
    enable: false
  code_block:
    copy: true
    style: simple
  toc:
    enable: true
    max_depth: 3
footer:
  runtime: false
  icon: ''
  statistics: false
  customize: 科研、项目与学习笔记
page_templates:
  tags_style: cloud
inject:
  enable: false
