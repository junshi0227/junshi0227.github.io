title: Junshi Blog
subtitle: 科研、项目与学习笔记
description: 记录研究过程、工程实践与持续学习。
keywords: GNSS,PPP,信号处理,嵌入式,学习笔记
author: 君军均俊钧
language: zh-CN
timezone: Asia/Shanghai
url: https://junshi0227.github.io
root: /
permalink: posts/:title/
source_dir: source
public_dir: public
tag_dir: tags
archive_dir: archives
category_dir: categories
skip_render:
  - robots.txt
  - _redirects
new_post_name: :title.md
default_layout: post
render_drafts: false
post_asset_folder: false
relative_link: false
future: false
highlight:
  enable: true
  line_number: true
  auto_detect: false
  tab_replace: '  '
prismjs:
  enable: false
index_generator:
  path: ''
  per_page: 6
  order_by: -date
default_category: 未分类
archive_generator:
  per_page: 10
  yearly: true
  monthly: false
category_generator:
  per_page: 10
tag_generator:
  per_page: 10
search:
  path: search.xml
  field: post
  content: true
  format: html
mathjax:
  tags: none
  single_dollars: true
  cjk_width: 0.9
  normal_width: 0.6
  append_css: true
  every_page: false
theme: redefine
